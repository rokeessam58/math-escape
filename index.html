<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수학 복습 방탈출</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <style>
        @font-face {
            font-family: 'BusanDandiGothic';
            src: url('https://cdn.jsdelivr.net/gh/Project-Noonnu/2610132210@l/l/부산단디고딕M.woff2') format('woff2');
            font-weight: 500; font-display: swap;
        }
        @font-face {
            font-family: 'BusanDandiGothic';
            src: url('https://cdn.jsdelivr.net/gh/Project-Noonnu/2610132210@l/l/부산단디고딕B.woff2') format('woff2');
            font-weight: 700; font-display: swap;
        }

        :root {
            --panel: #12151a;
            --panel-deep: #0d1014;
            --line: #2c3138;
            --text: #d8d4cc;
            --text-strong: #ece6da;
            --muted: #8b9199;
            --red: #c4313a;
            --red-dark: #8f1d27;
            --red-glow: rgba(196, 49, 58, 0.35);
        }

        body {
            font-family: 'BusanDandiGothic', sans-serif;
            margin: 0; padding: 0;
            background-color: #0a0b0d;
            background-image: radial-gradient(ellipse at 50% 0%, #220e11 0%, #0a0b0d 65%);
            background-attachment: fixed;
            color: var(--text);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; box-sizing: border-box;
        }
        .container {
            width: 92%; max-width: 480px;
            background: var(--panel); padding: 30px 25px;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), 0 0 50px rgba(143, 29, 39, 0.18);
            border: 1px solid #3a1d21;
            text-align: center; box-sizing: border-box;
            position: relative; overflow: hidden;
        }
        .container::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--red), transparent);
        }
        .screen { display: none; }
        .active { display: block; animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        h2 { font-family: 'BusanDandiGothic', sans-serif; font-weight: 700; color: var(--text-strong); letter-spacing: 1px; text-shadow: 0 0 18px var(--red-glow); margin-top: 0; font-size: 26px; }
        h3 { color: var(--red); font-family: 'BusanDandiGothic', sans-serif; }

        input {
            width: 100%; padding: 14px; margin: 8px 0;
            border: 2px solid var(--line); border-radius: 6px;
            background: var(--panel-deep); color: var(--text-strong); font-size: 16px; box-sizing: border-box;
            font-family: 'BusanDandiGothic', sans-serif; transition: 0.3s;
        }
        input::placeholder { color: #5f666f; }
        input:focus { border-color: var(--red); outline: none; background: #0b0d10; box-shadow: 0 0 0 3px rgba(196, 49, 58, 0.2); }
        input:disabled { background: #15181d; color: #6d747d; border-color: #23272d; }

        button {
            width: 100%; padding: 14px; margin-top: 15px;
            background: var(--red-dark); color: #f5ecea; font-weight: 700;
            border: none; border-radius: 6px; font-size: 16px; letter-spacing: 0.5px;
            font-family: 'BusanDandiGothic', sans-serif; cursor: pointer; transition: 0.2s;
        }
        button:hover:not(:disabled) { background: #b0252f; transform: translateY(-1px); box-shadow: 0 0 16px var(--red-glow); }
        button:disabled { background: #1d2127; color: #565d66; cursor: not-allowed; transform: none; box-shadow: none; }

        /* 버튼 컬러 옵션들 */
        .btn-danger { background: #3a1418; color: #ff9a9a; }
        .btn-danger:hover:not(:disabled) { background: #4d1a20; }
        .btn-warning { background: #6b4a10; color: #f6e1a8; margin-top: 20px;}
        .btn-warning:hover:not(:disabled) { background: #86601a; box-shadow: 0 0 16px rgba(214, 160, 40, 0.3); }
        .btn-outline { background: transparent; color: #aab0b8; border: 1px solid #3a4048; }
        .btn-outline:hover:not(:disabled) { background: #1a1e24; box-shadow: none; }

        /* 대기실 요소 */
        .role-btn {
            width: 100%; background: #0f1217; color: #cfcac0; border: 2px solid var(--line);
            padding: 18px 15px; margin: 10px 0; border-radius: 8px;
            text-align: left; display: flex; justify-content: space-between; align-items: center;
            font-size: 16px; cursor: pointer; box-shadow: none;
        }
        .role-btn:hover:not(:disabled) { background: #181c22; box-shadow: none; transform: none; }
        .role-btn.selected { border-color: var(--red); background: #1b1013; box-shadow: 0 0 18px var(--red-glow); color: #fff; font-weight: 700; }
        .role-btn.selected:hover:not(:disabled) { background: #1b1013; box-shadow: 0 0 18px var(--red-glow); }
        .role-btn:disabled { opacity: 0.5; cursor: not-allowed; background: #0b0d10; }
        .status-text { font-size: 14px; color: var(--muted); font-weight: normal; }
        .ready-player { color: #ff8a7a; font-weight: 700; }

        #game-stage-desc p { margin: 0 0 4px 0; }

        /* 초기 설명(인트로) 화면 */
        .intro-box {
            background: var(--panel-deep); padding: 20px; border-radius: 6px;
            margin: 15px 0; text-align: left; border: 1px solid #23282f; border-left: 4px solid var(--red);
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.5); line-height: 1.7; color: var(--text);
        }
        .intro-box p { margin: 0; white-space: pre-line; }

        /* 게임 요소 */
        @keyframes heartbeat { 0%, 100% { box-shadow: 0 0 0 rgba(255, 60, 60, 0); } 50% { box-shadow: 0 0 16px rgba(255, 60, 60, 0.35); } }
        .timer-banner {
            font-family: 'BusanDandiGothic', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: 2px;
            color: #ff4d4d; background: #1a0a0c; padding: 12px; border-radius: 6px; margin-bottom: 20px;
            border: 1px solid #5a1a20; text-shadow: 0 0 10px rgba(255, 60, 60, 0.6);
            animation: heartbeat 2s ease-in-out infinite;
        }
        .quiz-box {
            background: #e6e0d0; color: #2b2620; padding: 20px; border-radius: 4px;
            margin: 15px 0; text-align: left; border-left: 5px solid var(--red-dark);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.55); line-height: 1.6;
        }
        .team-status-board {
            background: var(--panel-deep); padding: 15px; border-radius: 8px; margin-top: 25px; border: 1px solid #23282f;
        }
        .team-status-board h4 { font-family: 'BusanDandiGothic', sans-serif; margin-top:0; color: #aab0b8; }
        .team-member-row {
            display: flex; justify-content: space-between; align-items: center; margin: 8px 0; font-size: 15px; color: #cfcac0;
        }
        .badge { padding: 4px 10px; border-radius: 4px; font-size: 13px; font-weight: 700; font-family: 'BusanDandiGothic', sans-serif;}
        .badge.solved { background: #12301f; color: #6fe0a0; border: 1px solid #1f5a3a; }
        .badge.unsolved { background: #2e1114; color: #ff8a8a; border: 1px solid #5a1f25; }

        .penalty-text { color: #ff5a5a; font-weight: 700; margin-top: 5px; font-size: 14px; display: none; text-shadow: 0 0 8px rgba(255, 60, 60, 0.5); }

        .ending-title { font-family: 'BusanDandiGothic', sans-serif; font-size: 32px; font-weight: 700; margin-bottom: 15px; letter-spacing: 1px; }
        .clear-text { color: #6fe0a0; text-shadow: 0 0 20px rgba(111, 224, 160, 0.45); }
        .fail-text { color: #ff4d4d; text-shadow: 0 0 20px rgba(255, 77, 77, 0.5); }

        /* 팝업 모달 & 로딩 오버레이 스타일 */
        .modal-overlay, .loading-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.72); backdrop-filter: blur(6px);
            z-index: 10000; align-items: center; justify-content: center;
        }
        .modal-box, .loading-box {
            background: #14181d; padding: 30px 35px; border-radius: 10px; border: 1px solid #3a1d21;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 30px rgba(143, 29, 39, 0.2); text-align: center;
            max-width: 380px; width: 85%; font-family: 'BusanDandiGothic', sans-serif;
        }
        .modal-box p, .loading-box p {
            font-size: 16px; color: var(--text-strong); margin: 0 0 20px 0; line-height: 1.5; font-weight: 700;
        }
        .loading-box p { margin: 0; font-family: 'BusanDandiGothic', sans-serif; font-size: 20px; }
        .modal-btn-group { display: flex; gap: 10px; justify-content: center; }
        .modal-btn {
            padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer;
            font-weight: 700; font-size: 14px; flex: 1; transition: 0.2s;
        }
        .modal-btn-ok { background: var(--red-dark); color: #f5ecea; }
        .modal-btn-cancel { background: #23272d; color: #aab0b8; }
        .modal-btn-cancel:hover:not(:disabled) { background: #2d3239; box-shadow: none; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, update, get, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC8h3jceC6gmoU24plIimhvEOJPUWrYRNg",
            authDomain: "ms1st-math-escape-ver1.firebaseapp.com",
            databaseURL: "https://ms1st-math-escape-ver1-default-rtdb.firebaseio.com",
            projectId: "ms1st-math-escape-ver1"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let myRoom = ""; let myName = ""; let myRole = ""; let currentStageNum = 1;
        let timerInterval = null; let currentRoomData = null; let currentAttempts = 0;
        let GAME_LIMIT_TIME = 40 * 60 * 1000; // 기본 40분
        let TOTAL_STAGES = 10; // 기본 10스테이지 (교사가 settings/totalStages로 조절 가능)
        let quizzes = {};
        const MAX_MEMBERS = 3;

        // Firebase 키로 쓸 수 없는 문자(. 등)를 피하기 위해 이름을 인코딩
        function memberKey(name) {
            return encodeURIComponent(name).replace(/\./g, '%2E');
        }

        // 한글 입력(IME) 중 마지막 글자가 조합 상태에서 버튼을 바로 누르면, 클릭 처리 시점에 아직 값에 반영되지 않을 수 있어
        // 입력창 값을 읽기 전에 잠깐 기다려서 조합이 확정되도록 함
        function waitForImeCommit() {
            const active = document.activeElement;
            if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) active.blur();
            return new Promise(resolve => setTimeout(resolve, 60));
        }

        // 한/영 키가 한글 상태여도 같은 자판 위치의 영문 대문자/숫자로 자동 변환 (예: ㅁㅠㅊ → ABC)
        const JAMO_KEYS = {
            'ㄱ':'r','ㄲ':'r','ㄴ':'s','ㄷ':'e','ㄸ':'e','ㄹ':'f','ㅁ':'a','ㅂ':'q','ㅃ':'q','ㅅ':'t','ㅆ':'t','ㅇ':'d','ㅈ':'w','ㅉ':'w','ㅊ':'c','ㅋ':'z','ㅌ':'x','ㅍ':'v','ㅎ':'g',
            'ㅏ':'k','ㅐ':'o','ㅑ':'i','ㅒ':'o','ㅓ':'j','ㅔ':'p','ㅕ':'u','ㅖ':'p','ㅗ':'h','ㅘ':'hk','ㅙ':'ho','ㅚ':'hl','ㅛ':'y','ㅜ':'n','ㅝ':'nj','ㅞ':'np','ㅟ':'nl','ㅠ':'b','ㅡ':'m','ㅢ':'ml','ㅣ':'l',
            'ㄳ':'rt','ㄵ':'sw','ㄶ':'sg','ㄺ':'fr','ㄻ':'fa','ㄼ':'fq','ㄽ':'ft','ㄾ':'fx','ㄿ':'fv','ㅀ':'fg','ㅄ':'qt'
        };
        const HANGUL_INITIALS = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
        const HANGUL_MEDIALS = 'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ';
        const HANGUL_FINALS = '_ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ';
        function toEntryCode(str) {
            let out = '';
            for (const ch of String(str)) {
                const c = ch.codePointAt(0);
                if (c >= 0xAC00 && c <= 0xD7A3) {
                    const i = c - 0xAC00;
                    out += JAMO_KEYS[HANGUL_INITIALS[Math.floor(i / 588)]] + JAMO_KEYS[HANGUL_MEDIALS[Math.floor((i % 588) / 28)]];
                    if (i % 28) out += JAMO_KEYS[HANGUL_FINALS[i % 28]];
                } else if (JAMO_KEYS[ch]) {
                    out += JAMO_KEYS[ch];
                } else {
                    out += ch;
                }
            }
            return out.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 5);
        }

        function normalizeAnswer(s) {
            return String(s).trim().toLowerCase().replace(/\s+/g, '');
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        window.onload = function() {
            // 제한 시간 연동
            onValue(ref(db, 'settings/timeLimit'), (snapshot) => {
                const limit = snapshot.val();
                if(limit) GAME_LIMIT_TIME = limit * 60 * 1000;
            });

            onValue(ref(db, 'settings/totalStages'), (snapshot) => {
                const total = snapshot.val();
                if(total) TOTAL_STAGES = total;
            });

            onValue(ref(db, 'quizzes'), (snapshot) => {
                quizzes = snapshot.val() || {};
                // 게임 화면을 보고 있는 도중 선생님이 문제를 추가/수정하면 즉시 반영
                if (document.getElementById('game-screen').classList.contains('active') && currentRoomData) {
                    enterGameScreen(currentRoomData);
                }
            });
            
            const savedRoom = localStorage.getItem("roomNum");
            const savedName = localStorage.getItem("userName");
            const savedRole = localStorage.getItem("userRole");
            
            if (savedRoom && savedName) {
                myRoom = savedRoom; myName = savedName; myRole = savedRole || "";
                enterLobby();
            } else {
                showScreen("login-screen");
            }
        }

        window.handleLogin = async function() {
            const btn = document.getElementById("login-btn");
            if (btn.disabled) return;
            btn.disabled = true; btn.innerText = "입장 중...";
            try {
                await waitForImeCommit();
                await attemptLogin();
            } finally {
                btn.disabled = false; btn.innerText = "대기실 입장하기";
            }
        }

        async function attemptLogin() {
            const roomInput = document.getElementById("room-input").value.trim();
            const nameInput = document.getElementById("name-input").value.trim();
            if(!roomInput || !nameInput) return await customAlert("조 번호와 이름을 모두 입력해 주세요.");
            
            const roomRef = ref(db, `rooms/room_${roomInput}`);
            const snapshot = await get(roomRef);
            if (!snapshot.exists()) {
                await set(roomRef, {
                    status: "waiting", currentStage: 1, startTime: 0, stageStartTime: 0,
                    players: { high: "", mid: "", low: "" }
                });
            } else {
                // 이미 3명이 입장한 조라면 (역할 선택 여부와 무관하게) 새로운 사람은 입장 불가
                const room = snapshot.val();
                const names = new Set(Object.values(room.members || {}));
                ['high', 'mid', 'low'].forEach(r => {
                    if (room.players && room.players[r] && room.players[r].name) names.add(room.players[r].name);
                });
                if (!names.has(nameInput) && names.size >= MAX_MEMBERS) {
                    return await customAlert(`${roomInput}조는 이미 ${MAX_MEMBERS}명이 입장해서 더 들어갈 수 없어요.\n조 번호를 다시 확인해 주세요.`);
                }
            }

            // 동시에 4번째 사람이 들어오는 경우까지 막기 위해 트랜잭션으로 입장 명단에 등록
            const key = memberKey(nameInput);
            const result = await runTransaction(ref(db, `rooms/room_${roomInput}/members`), (members) => {
                members = members || {};
                if (members[key]) return members;
                if (Object.keys(members).length >= MAX_MEMBERS) return; // 정원 초과 -> 중단
                members[key] = nameInput;
                return members;
            });
            if (!result.committed) {
                return await customAlert(`${roomInput}조는 이미 ${MAX_MEMBERS}명이 입장해서 더 들어갈 수 없어요.\n조 번호를 다시 확인해 주세요.`);
            }

            myRoom = roomInput; myName = nameInput;
            localStorage.setItem("roomNum", myRoom);
            localStorage.setItem("userName", myName);
            enterLobby();
        }

        function enterLobby() {
            showScreen("lobby-screen");
            document.getElementById("lobby-title").innerText = `${myRoom}조 대기실`;
            
            onValue(ref(db, `rooms/room_${myRoom}`), async (snapshot) => {
                const roomData = snapshot.val();
                
                // 🔥 교사가 일괄 초기화(DB 삭제)를 한 경우 캐시 비우고 쫓아내기!
                if (!roomData) {
                    await customAlert("선생님에 의해 게임이 강제 종료/초기화 되었습니다. 처음 화면으로 돌아갑니다.");
                    localStorage.clear(); clearInterval(timerInterval); location.reload(); 
                    return;
                }
                
                currentRoomData = roomData;
                if (roomData.status === "playing") {
                    showWaitingForLeaderModal(false); // 혹시 떠 있던 "팀장 대기" 모달 닫기
                    // 이 학생이 이 방에서 아직 초기 설명(인트로)을 안 봤다면 게임 화면 대신 인트로부터 보여줌
                    if (!localStorage.getItem(`introSeen_${myRoom}`)) {
                        if (!document.getElementById('intro-screen').classList.contains('active')) {
                            showIntroScreen();
                        }
                    } else {
                        enterGameScreen(roomData);
                    }
                    return;
                }
                else if (roomData.status === "cleared") { showWaitingForLeaderModal(false); showEndingScreen("clear"); return; }
                else if (roomData.status === "failed") { showWaitingForLeaderModal(false); showEndingScreen("fail"); return; }

                updateLobbyUI(roomData.players);

                // 대기실(waiting) 상태: 팀장이 입장 코드를 입력하는 중이면 나머지 조원에게 대기 모달 표시
                showWaitingForLeaderModal(roomData.awaitingCode === true && myRole !== 'high');
            });
        }

        async function showIntroScreen() {
            const introSnap = await get(ref(db, 'intro'));
            const intro = introSnap.exists() ? introSnap.val() : {};
            document.getElementById('intro-title').innerText = intro.title || "미션 시작!";
            document.getElementById('intro-text').innerText = intro.text || "선생님이 아직 이야기를 등록하지 않았어요. 그래도 탐험을 시작해 볼까요?";
            showScreen('intro-screen');
        }

        window.startFromIntro = function() {
            localStorage.setItem(`introSeen_${myRoom}`, "true");
            if (currentRoomData) enterGameScreen(currentRoomData);
        }

        function updateLobbyUI(players) {
            const roles = ['high', 'mid', 'low'];
            let readyCount = 0; let serverHasMyRole = false;

            roles.forEach(role => {
                const btn = document.getElementById(`btn-${role}`);
                const status = document.getElementById(`status-${role}`);
                if (players && players[role] && players[role].name) {
                    status.innerHTML = `👑 <span class="ready-player">${players[role].name}</span> 완료`;
                    readyCount++;
                    if (players[role].name === myName) {
                        btn.disabled = false; btn.classList.add('selected');
                        myRole = role; localStorage.setItem("userRole", role); serverHasMyRole = true;
                    } else {
                        btn.disabled = true; btn.classList.remove('selected');
                    }
                } else {
                    status.innerText = "대기 중...";
                    btn.disabled = false; btn.classList.remove('selected');
                }
            });

            if (!serverHasMyRole) { myRole = ""; localStorage.removeItem("userRole"); }

            const startBtn = document.getElementById("start-game-btn");
            if (readyCount === 3) {
                if (myRole === 'high') {
                    startBtn.disabled = false; startBtn.innerText = "게임 시작하기";
                } else {
                    startBtn.disabled = true; startBtn.innerText = "준비 완료";
                }
            } else {
                startBtn.disabled = true; startBtn.innerText = `팀원을 기다리는 중... (${readyCount}/3)`;
            }
        }

        window.selectRole = async function(role) {
            if (!myRoom || !myName) return;
            if (myRole === role) {
                if (await customConfirm("선택한 역할을 취소하시겠습니까?")) {
                    await set(ref(db, `rooms/room_${myRoom}/players/${role}`), null);
                    myRole = ""; localStorage.removeItem("userRole");
                }
                return;
            }

            // 🔒 트랜잭션으로 원자적 선점: 두 학생이 동시에 같은 역할을 눌러도 한 명만 성공
            const roleRef = ref(db, `rooms/room_${myRoom}/players/${role}`);
            const result = await runTransaction(roleRef, (currentData) => {
                // 방 생성 시 players.high/mid/low는 null이 아니라 빈 문자열("")로 초기화되므로
                // falsy 체크(!currentData)로 "아직 아무도 선택 안 함"을 판정해야 함
                if (!currentData || !currentData.name) {
                    return { name: myName, isReady: true, isSolved: false, attempts: 0, solveTime: 0 };
                }
                return; // 이미 다른 사람이 선점 -> 트랜잭션 중단
            });

            if (!result.committed) {
                await customAlert("앗, 방금 다른 조원이 먼저 그 역할을 선택했어요. 다른 난이도를 선택해 주세요.");
                return;
            }

            // 새 역할 외에 내 이름으로 잡혀 있는 다른 역할은 모두 해제.
            // (myRole 전역 변수는 실시간 리스너가 이름 일치 순서대로 덮어쓰므로, 이전 역할을 myRole로 판단하면
            //  상 → 중/하 전환 시 이전 역할이 해제되지 않아 두 역할이 동시에 점유되는 문제가 생김)
            const playersSnap = await get(ref(db, `rooms/room_${myRoom}/players`));
            const currentPlayers = playersSnap.val() || {};
            const releases = {};
            ['high', 'mid', 'low'].forEach(r => {
                if (r !== role && currentPlayers[r] && currentPlayers[r].name === myName) releases[r] = null;
            });
            if (Object.keys(releases).length > 0) await update(ref(db, `rooms/room_${myRoom}/players`), releases);

            myRole = role; localStorage.setItem("userRole", role);
        }

        window.startGame = async function() {
            if (myRole !== 'high') return; // 안전장치: 입장 코드는 팀장만 입력 가능

            // 팀원들 화면에 "팀장이 입력 중" 대기 모달을 띄우기 위한 플래그
            await update(ref(db, `rooms/room_${myRoom}`), { awaitingCode: true });

            const code = await customPrompt("선생님께 안내받은 입장 코드를 입력하세요.");

            if (code === null) {
                await update(ref(db, `rooms/room_${myRoom}`), { awaitingCode: false });
                return; // 취소함
            }

            const correctSnap = await get(ref(db, 'settings/entryCode'));
            const correctCode = correctSnap.exists() ? correctSnap.val() : "";

            if (!correctCode) {
                await update(ref(db, `rooms/room_${myRoom}`), { awaitingCode: false });
                await customAlert("선생님이 아직 입장 코드를 설정하지 않았습니다. 선생님께 문의해 주세요.");
                return;
            }

            if (code !== correctCode) {
                await update(ref(db, `rooms/room_${myRoom}`), { awaitingCode: false });
                await customAlert("입장 코드가 올바르지 않습니다. 다시 확인해 주세요.");
                return;
            }

            const now = Date.now();
            update(ref(db, `rooms/room_${myRoom}`), { status: "playing", currentStage: 1, startTime: now, stageStartTime: now, awaitingCode: false });
        }

        window.handleLogout = async function() {
            if (await customConfirm("대기실에서 나가시겠습니까?")) {
                if (myRoom && myRole) await set(ref(db, `rooms/room_${myRoom}/players/${myRole}`), null);
                if (myRoom && myName) await set(ref(db, `rooms/room_${myRoom}/members/${memberKey(myName)}`), null);
                clearInterval(timerInterval); localStorage.clear();
                myRoom = ""; myName = ""; myRole = "";
                showScreen("login-screen");
            }
        }

        // ================= 본 게임 로직 =================
        function enterGameScreen(roomData) {
            showScreen("game-screen");
            const stageNum = roomData.currentStage;
            const stageKey = `stage_${stageNum}`;

            // 설정된 총 스테이지 수를 넘어서면 진짜 클리어
            if (stageNum > TOTAL_STAGES) {
                update(ref(db, `rooms/room_${myRoom}`), { status: "cleared" });
                return;
            }

            // 총 스테이지 범위 안인데 문제가 아직(또는 일시적으로) 없는 경우 -> 클리어 처리하지 않고 대기
            if (!quizzes[stageKey] || !quizzes[stageKey][myRole]) {
                document.getElementById("game-stage-title").innerText = `Stage ${stageNum}`;
                document.getElementById("game-stage-desc").style.display = "none";
                document.getElementById("stage-img").style.display = "none";
                document.getElementById("quiz-text").innerText = "선생님이 아직 이 스테이지의 문제를 등록하지 않았어요. 잠시만 기다려 주세요...";
                document.getElementById("quiz-img").style.display = "none";
                return;
            }

            if (currentStageNum !== stageNum) {
                currentStageNum = stageNum; currentAttempts = 0; 
                const inputEl = document.getElementById("answer-input");
                const btnEl = document.getElementById("submit-btn");
                const penaltyEl = document.getElementById("penalty-countdown");

                inputEl.disabled = false; inputEl.value = "";
                btnEl.disabled = false; btnEl.innerText = "정답 제출";
                if (penaltyEl) penaltyEl.style.display = "none";
            }

            const currentStageData = quizzes[stageKey];
            document.getElementById("game-stage-title").innerText = `Stage ${stageNum} : ${currentStageData.stageName || "비밀의 방"}`;
            
            // 스테이지 공통 이미지 (제목과 설명 사이). 값이 바뀐 경우에만 다시 불러와 깜빡임 방지
            const stageImgEl = document.getElementById("stage-img");
            if (currentStageData.stageImageUrl) {
                if (stageImgEl.dataset.loadedUrl !== currentStageData.stageImageUrl) {
                    stageImgEl.src = currentStageData.stageImageUrl;
                    stageImgEl.dataset.loadedUrl = currentStageData.stageImageUrl;
                }
                stageImgEl.style.display = "block";
            } else {
                stageImgEl.style.display = "none";
                stageImgEl.dataset.loadedUrl = "";
            }

            // 스토리(설명) 반영 부분
            const descEl = document.getElementById("game-stage-desc");
            if(currentStageData.stageDesc) {
                if (descEl.dataset.rendered !== currentStageData.stageDesc) {
                    descEl.innerHTML = currentStageData.stageDesc;
                    descEl.dataset.rendered = currentStageData.stageDesc;
                }
                descEl.style.display = "block";
            } else {
                descEl.style.display = "none";
            }

            if(myRole && currentStageData[myRole]) {
                // 팀원 상태 갱신 때마다 같은 내용을 다시 넣으면 이미지가 재로딩되며 깜빡이므로, 값이 바뀐 경우에만 반영
                const quizTextEl = document.getElementById("quiz-text");
                if (quizTextEl.dataset.rendered !== currentStageData[myRole].question) {
                    quizTextEl.innerHTML = currentStageData[myRole].question;
                    quizTextEl.dataset.rendered = currentStageData[myRole].question;
                }
                const imgEl = document.getElementById("quiz-img");
                const imageUrl = currentStageData[myRole].imageUrl;
                if(imageUrl) {
                    if (imgEl.dataset.loadedUrl !== imageUrl) {
                        imgEl.src = imageUrl;
                        imgEl.dataset.loadedUrl = imageUrl;
                    }
                    imgEl.style.display = "block";
                } else {
                    imgEl.style.display = "none";
                    imgEl.dataset.loadedUrl = "";
                }
                
                if(roomData.players[myRole].isSolved) {
                    document.getElementById("answer-input").disabled = true;
                    document.getElementById("answer-input").value = currentStageData[myRole].answer;
                    document.getElementById("submit-btn").disabled = true;
                    document.getElementById("submit-btn").innerText = "제출 완료";
                }
            }

            if (!timerInterval && roomData.startTime > 0) startGlobalTimer(roomData.startTime);
            updateTeamStatusBoard(roomData.players);
        }

        function startGlobalTimer(startTime) {
            const timerEl = document.getElementById("time-display");
            timerInterval = setInterval(() => {
                const remainingTime = GAME_LIMIT_TIME - (Date.now() - startTime);
                if (remainingTime <= 0) {
                    clearInterval(timerInterval); timerEl.innerText = "00:00";
                    update(ref(db, `rooms/room_${myRoom}`), { status: "failed" });
                } else {
                    const min = Math.floor(remainingTime / 60000);
                    const sec = Math.floor((remainingTime % 60000) / 1000);
                    timerEl.innerText = `${min < 10 ? '0'+min : min}:${sec < 10 ? '0'+sec : sec}`;
                }
            }, 1000);
        }

        function updateTeamStatusBoard(players) {
            const roles = { high: "🔥 상", mid: "⚡ 중", low: "🌱 하" };
            let allClear = true;

            Object.keys(roles).forEach(role => {
                const pInfo = players[role];
                const nameEl = document.getElementById(`status-name-${role}`);
                const badgeEl = document.getElementById(`status-badge-${role}`);

                if (pInfo) {
                    nameEl.innerText = `${roles[role]}: ${pInfo.name}`;
                    if(pInfo.isSolved) { badgeEl.innerText = "정답"; badgeEl.className = "badge solved"; } 
                    else { badgeEl.innerText = "푸는 중"; badgeEl.className = "badge unsolved"; allClear = false; }
                } else {
                    nameEl.innerText = `${roles[role]}: 탈주함`;
                    badgeEl.innerText = "공석"; badgeEl.className = "badge unsolved"; allClear = false;
                }
            });

            const nextBtn = document.getElementById("next-stage-btn");
            if (allClear) {
                nextBtn.disabled = false; nextBtn.innerText = "다음 구역으로 탈출하기! 🎉";
            } else {
                nextBtn.disabled = true; nextBtn.innerText = "모든 조원이 정답을 맞춰야 탈출 가능합니다";
            }
        }

        let isSubmittingAnswer = false;
        window.submitAnswer = async function() {
            if (isSubmittingAnswer) return;
            isSubmittingAnswer = true;
            try {
                await waitForImeCommit();
                await processAnswer();
            } finally {
                isSubmittingAnswer = false;
            }
        }

        async function processAnswer() {
            const inputEl = document.getElementById("answer-input");
            const btnEl = document.getElementById("submit-btn");
            const penaltyEl = document.getElementById("penalty-countdown");
            
            const userAns = inputEl.value.trim();
            if(!userAns) return await customAlert("답안을 입력하세요.");

            const rightAns = quizzes[`stage_${currentStageNum}`][myRole].answer;
            const myPlayerRef = ref(db, `rooms/room_${myRoom}/players/${myRole}`);
            currentAttempts++; 

            if (normalizeAnswer(userAns) === normalizeAnswer(rightAns)) { // 공백/대소문자 무시하고 비교
                await customAlert("🎉 정답입니다! 팀원들이 풀 때까지 기다려 주세요.");
                inputEl.disabled = true; btnEl.disabled = true; btnEl.innerText = "제출 완료";
                const solveTimeSec = Math.floor((Date.now() - currentRoomData.stageStartTime) / 1000);
                // submittedAnswerNormalized: DB 규칙이 실제 정답과 대조 검증할 수 있도록 함께 기록
                // (콘솔에서 isSolved:true만 억지로 써도, 이 값이 정답과 안 맞으면 DB 규칙이 거부함)
                await update(myPlayerRef, { isSolved: true, attempts: currentAttempts, solveTime: solveTimeSec, submittedAnswerNormalized: normalizeAnswer(userAns) });
            } else {
                // 패널티는 오답 모달이 뜨는 즉시 백그라운드에서 카운트 시작 (모달을 닫는 시점과 무관)
                inputEl.value = ""; inputEl.disabled = true; btnEl.disabled = true; penaltyEl.style.display = "block";
                let timeLeft = 10; penaltyEl.innerText = `⏱️ 패널티 격리 중: ${timeLeft}초 남음`;
                const timer = setInterval(() => {
                    timeLeft--;
                    if(timeLeft <= 0) {
                        clearInterval(timer);
                        inputEl.disabled = false; btnEl.disabled = false;
                        penaltyEl.style.display = "none"; btnEl.innerText = "정답 제출";
                    } else { penaltyEl.innerText = `⏱️ 패널티 격리 중: ${timeLeft}초 남음`; }
                }, 1000);

                update(myPlayerRef, { attempts: currentAttempts });
                await customAlert("❌ 오답입니다! 신중하게 다시 계산해 보세요.\n(10초 동안 입력창이 잠깁니다.)");
            }
        }

        window.goToNextStage = async function() {
            const nextStage = currentStageNum + 1;
            const updates = {
                currentStage: nextStage, stageStartTime: Date.now(), 
                "players/high/isSolved": false, "players/high/attempts": 0, "players/high/solveTime": 0,
                "players/mid/isSolved": false, "players/mid/attempts": 0, "players/mid/solveTime": 0,
                "players/low/isSolved": false, "players/low/attempts": 0, "players/low/solveTime": 0
            };
            await update(ref(db, `rooms/room_${myRoom}`), updates);
        }

        function showEndingScreen(type) {
            clearInterval(timerInterval); showScreen("ending-screen");
            const contentEl = document.getElementById("ending-content");
            if(type === "clear") {
                contentEl.innerHTML = `
                    <h1 class="ending-title clear-text">🎉 ESCAPE CLEAR!</h1>
                    <p style="font-size: 16px; line-height: 1.6;">수고하셨습니다!<br>조원들과 힘을 합쳐 제한 시간 내에 <br>학교 방탈출 미션을 완벽히 해결했습니다!</p>`;
            } else {
                contentEl.innerHTML = `
                    <h1 class="ending-title fail-text">👻 GAME OVER</h1>
                    <p style="font-size: 16px; line-height: 1.6;">시간이 초과되었습니다...<br>학교에서 미처 빠져나가지 못하고 갇혔습니다.<br>다시 도전해 보세요!</p>`;
            }
        }

        window.resetToMain = function() { localStorage.clear(); location.reload(); }

        // 팀장이 입장 코드를 입력하는 동안 나머지 조원에게 보여주는 대기 모달 (버튼 없이 자동으로 뜨고 닫힘)
        let waitingForLeaderShown = false;
        function showWaitingForLeaderModal(show) {
            const overlay = document.getElementById('custom-modal-overlay');
            if (show) {
                const btns = document.getElementById('custom-modal-btns');
                const msgEl = document.getElementById('custom-modal-msg');
                btns.style.flexDirection = 'row';
                msgEl.style.marginBottom = '0'; // 버튼이 없으므로 아래 여백 없애서 세로 중앙에 보이도록
                msgEl.innerHTML = "팀장이 입장 코드를 입력할 때까지<br>잠시 기다려주세요.";
                btns.innerHTML = '';
                overlay.style.display = 'flex';
                waitingForLeaderShown = true;
            } else if (waitingForLeaderShown) {
                overlay.style.display = 'none';
                waitingForLeaderShown = false;
            }
        }

        // 커스텀 alert / confirm 함수 정의
        window.customAlert = function(msg) {
            return new Promise(resolve => {
                const overlay = document.getElementById('custom-modal-overlay');
                const btns = document.getElementById('custom-modal-btns');
                const msgEl = document.getElementById('custom-modal-msg');
                btns.style.flexDirection = 'row';
                msgEl.style.marginBottom = '20px';
                msgEl.innerHTML = msg.replace(/\n/g, '<br>');
                btns.innerHTML = `<button class="modal-btn modal-btn-ok">확인</button>`;
                overlay.style.display = 'flex';
                overlay.querySelector('.modal-btn-ok').onclick = () => { overlay.style.display = 'none'; resolve(); };
            });
        }

        window.customConfirm = function(msg) {
            return new Promise(resolve => {
                const overlay = document.getElementById('custom-modal-overlay');
                const btns = document.getElementById('custom-modal-btns');
                const msgEl = document.getElementById('custom-modal-msg');
                btns.style.flexDirection = 'row';
                msgEl.style.marginBottom = '20px';
                msgEl.innerHTML = msg.replace(/\n/g, '<br>');
                btns.innerHTML = `
                    <button class="modal-btn modal-btn-cancel">취소</button>
                    <button class="modal-btn modal-btn-ok">확인</button>
                `;
                overlay.style.display = 'flex';
                overlay.querySelector('.modal-btn-cancel').onclick = () => { overlay.style.display = 'none'; resolve(false); };
                overlay.querySelector('.modal-btn-ok').onclick = () => { overlay.style.display = 'none'; resolve(true); };
            });
        }

        // 입장 코드처럼 짧은 텍스트를 입력받는 프롬프트 (영문 대문자+숫자로 자동 변환)
        window.customPrompt = function(msg) {
            return new Promise(resolve => {
                const overlay = document.getElementById('custom-modal-overlay');
                const btns = document.getElementById('custom-modal-btns');
                const msgEl = document.getElementById('custom-modal-msg');
                msgEl.style.marginBottom = '20px';
                msgEl.innerHTML = msg.replace(/\n/g, '<br>');
                btns.style.flexDirection = 'column';
                btns.innerHTML = `
                    <input type="text" id="custom-modal-input" maxlength="5" autocomplete="off"
                        style="text-transform:uppercase; text-align:center; letter-spacing:6px; font-weight:bold; font-size:20px; margin:0 0 15px 0;"
                        placeholder="입장 코드">
                    <div style="display:flex; gap:10px;">
                        <button class="modal-btn modal-btn-cancel">취소</button>
                        <button class="modal-btn modal-btn-ok">확인</button>
                    </div>
                `;
                overlay.style.display = 'flex';

                const inputEl = document.getElementById('custom-modal-input');
                inputEl.focus();
                const normalizeInput = () => { inputEl.value = toEntryCode(inputEl.value); };
                inputEl.addEventListener('input', normalizeInput);
                inputEl.addEventListener('compositionend', normalizeInput);
                inputEl.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') { overlay.style.display = 'none'; resolve(toEntryCode(inputEl.value)); }
                });
                overlay.querySelector('.modal-btn-cancel').onclick = () => { overlay.style.display = 'none'; resolve(null); };
                overlay.querySelector('.modal-btn-ok').onclick = () => { overlay.style.display = 'none'; resolve(toEntryCode(inputEl.value)); };
            });
        }
    </script>
</head>
<body>
    <div class="container">
        <!-- 로그인 화면 -->
        <div id="login-screen" class="screen">
            <h2 style="font-size: 32px; margin-bottom: 10px;">수학 복습 방탈출</h2>
            <p style="color: #8b9199; margin-bottom: 25px;">조 번호와 이름을 입력하세요.</p>
            <input type="number" id="room-input" placeholder="조 번호 (예: 3)">
            <input type="text" id="name-input" placeholder="이름 (예: 홍길동)">
            <button id="login-btn" onclick="handleLogin()">대기실 입장하기</button>
        </div>

        <!-- 대기실 화면 -->
        <div id="lobby-screen" class="screen">
            <h2 id="lobby-title">0조 대기실</h2>
            <p style="color: #9aa0a8; margin-bottom: 20px;">자신이 담당할 난이도를 선택하세요.</p>
            <button id="btn-high" class="role-btn" onclick="selectRole('high')"><span>🔥 상 (팀장)</span><span id="status-high" class="status-text">대기 중...</span></button>
            <button id="btn-mid" class="role-btn" onclick="selectRole('mid')"><span>⚡ 중 (부팀장)</span><span id="status-mid" class="status-text">대기 중...</span></button>
            <button id="btn-low" class="role-btn" onclick="selectRole('low')"><span>🌱 하 (대원)</span><span id="status-low" class="status-text">대기 중...</span></button>
            
            <button id="start-game-btn" onclick="startGame()" disabled style="margin-top:25px;">팀원을 기다리는 중... (0/3)</button>
            <button class="btn-outline" onclick="handleLogout()" style="margin-top: 10px;">조 변경하기 (로그아웃)</button>
        </div>

        <!-- 초기 설명(인트로) 화면 -->
        <div id="intro-screen" class="screen">
            <h2 id="intro-title">미션 시작!</h2>
            <div class="intro-box">
                <p id="intro-text"></p>
            </div>
            <button onclick="startFromIntro()">🚪 탐험 시작하기!</button>
        </div>

        <!-- 게임 화면 -->
        <div id="game-screen" class="screen">
            <div class="timer-banner">⏱️ 남은 시간 : <span id="time-display">40:00</span></div>
            <h2 id="game-stage-title" style="margin-bottom: 5px;">Stage 1</h2>
            
            <!-- 새로 추가된 스테이지 스토리 설명 영역 -->
            <img id="stage-img" src="" alt="스테이지 이미지" style="display:none; max-width: 100%; border-radius: 12px; margin: 5px auto 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">

            <div id="game-stage-desc" style="font-size: 14px; color: #9aa0a8; font-family: 'BusanDandiGothic', sans-serif; margin-top: 0; margin-bottom: 15px; display: none; line-height: 1.4; white-space: pre-line;"></div>
            
            <div class="quiz-box">
                <p id="quiz-text" style="margin-top:0;">선생님이 문제를 불러오는 중입니다...</p>
                <img id="quiz-img" src="" alt="참고 이미지" style="display:none; max-width: 100%; border-radius: 12px; margin-top: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
            </div>
            
            <input type="text" id="answer-input" placeholder="정답 입력 (숫자나 텍스트)">
            <div id="penalty-countdown" class="penalty-text">⏱️ 패널티 격리 중: 10초 남음</div>
            <button id="submit-btn" onclick="submitAnswer()">정답 제출</button>

            <div class="team-status-board">
                <h4>👥 우리 조 탈출 현황</h4>
                <div class="team-member-row"><span id="status-name-high">🔥 상: 대기 중</span><span id="status-badge-high" class="badge unsolved">푸는 중</span></div>
                <div class="team-member-row"><span id="status-name-mid">⚡ 중: 대기 중</span><span id="status-badge-mid" class="badge unsolved">푸는 중</span></div>
                <div class="team-member-row"><span id="status-name-low">🌱 하: 대기 중</span><span id="status-badge-low" class="badge unsolved">푸는 중</span></div>
            </div>

            <button id="next-stage-btn" class="btn-warning" onclick="goToNextStage()" disabled>
                모든 조원이 정답을 맞춰야 탈출 가능합니다
            </button>
        </div>

        <!-- 엔딩 화면 -->
        <div id="ending-screen" class="screen">
            <div id="ending-content" style="margin: 40px 0;"></div>
            <button class="btn-outline" onclick="resetToMain()">처음 화면으로 돌아가기</button>
        </div>
    </div>

    <!-- 🎨 공통 커스텀 모달 -->
    <div id="custom-modal-overlay" class="modal-overlay">
        <div class="modal-box">
            <p id="custom-modal-msg"></p>
            <div id="custom-modal-btns" class="modal-btn-group"></div>
        </div>
    </div>

    <!-- ⏳ 대기실 입장 중 로딩 오버레이 -->
    <div id="loading-overlay" class="loading-overlay">
        <div class="loading-box">
            <p>입장 중... ⏳</p>
        </div>
    </div>
</body>
</html>
